name: VSeti server build
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['vseti/**', '.github/workflows/vseti-build.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: fork
      - name: исходники Teamgram + правки VSети
        run: |
          set -e
          git clone -q https://github.com/teamgram/teamgram-server.git src
          git -C src checkout -q "$(cat fork/vseti/server.base)"
          git -C src apply --whitespace=nowarn ../fork/vseti/server.patch
          git clone -q https://github.com/teamgram/proto.git tgproto
          git -C tgproto checkout -q "$(cat fork/vseti/proto.base)"
          git -C tgproto apply --whitespace=nowarn ../fork/vseti/proto.patch
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache-dependency-path: src/go.sum
      - name: build
        working-directory: src
        run: |
          set -e
          mkdir -p ../out
          for t in bff:./app/bff/bff/cmd/bff biz:./app/service/biz/biz/cmd/biz msg:./app/messenger/msg/cmd/msg sync:./app/messenger/sync/cmd/sync dfs:./app/service/dfs/cmd/dfs; do
            n=${t%%:*}; p=${t#*:}
            CGO_ENABLED=1 GOFLAGS=-mod=mod go build -ldflags "-s -w" -o ../out/$n $p
            sha256sum ../out/$n | cut -c1-64 > ../out/$n.sha
            xz -T0 -6 -f ../out/$n
          done
          echo "${GITHUB_SHA}" > ../out/commit.txt
          ls -la ../out
      - name: release
        working-directory: fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete server-latest -y --cleanup-tag || true
          gh release create server-latest ../out/* --title "VSети сервер ${GITHUB_SHA::7}" --notes "Сборка сервера VSети" --target "${GITHUB_SHA}"
